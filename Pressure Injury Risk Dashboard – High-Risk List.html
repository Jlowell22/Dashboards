document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n<span>Sensor feed live · updated 14:32<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-size: 14px; color: #3F454C\">Mon 28 Sep 2026<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section aria-label=\"Summary\" style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #E2E0D9; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 14px; color: #5A6068\">On high-risk list<\u002Fdiv>\n<div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-size: 44px; font-weight: 600; line-height: 1\">{{flaggedCount}}<\u002Fspan><span style=\"font-size: 14px; color: #5A6068\">of {{monitoredCount}} monitored<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 13px; color: #3F454C\">{{roundedCount}} of {{flaggedCount}} rounded today<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #E2E0D9; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5A6068\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #1F5FA8\"><\u002Fspan>Missed turn &gt; {{turnThreshold}} h<\u002Fdiv>\n<div style=\"font-size: 44px; font-weight: 600; line-height: 1; color: #1F5FA8\">{{turnCount}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #E2E0D9; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5A6068\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #B4540C\"><\u002Fspan>SEM &gt; {{semThreshold}} (heels or sacrum)<\u002Fdiv>\n<div style=\"font-size: 44px; font-weight: 600; line-height: 1; color: #B4540C\">{{semCount}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #1B1E22; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 14px; color: #C9CCD1\">Both triggers<\u002Fdiv>\n<div style=\"font-size: 44px; font-weight: 600; line-height: 1; color: #FFFFFF\">{{bothCount}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-label=\"High-risk patients\" style=\"background: #FFFFFF; border: 1px solid #E2E0D9; border-radius: 14px; display: flex; flex-direction: column; flex-grow: 1; overflow: hidden\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid #E2E0D9\">\n<div style=\"display: flex; gap: 8px\" role=\"group\" aria-label=\"Filter by trigger\">\n<sc-for list=\"{{filters}}\" as=\"f\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{f.pick}}\" aria-pressed=\"{{f.pressed}}\" style=\"{{f.style}}\">{{f.label}} <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; opacity: 0.8\">{{f.count}}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size: 13px; color: #5A6068\">Criteria: no reposition detected by triaxial accelerometer for &gt; {{turnThreshold}} h, <strong style=\"color: #1B1E22\">or<\u002Fstrong> subepidermal moisture &gt; {{semThreshold}} at sacrum or either heel<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 1.9fr 1.1fr 0.8fr 1.9fr 1.1fr 0.8fr 0.8fr 0.8fr 1.6fr; gap: 16px; padding: 12px 24px; background: #F8F7F4; border-bottom: 1px solid #E2E0D9; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6068\">\n<div>Patient<\u002Fdiv><div>MRN<\u002Fdiv><div>Room<\u002Fdiv><div>Triggers<\u002Fdiv><div>Since last turn<\u002Fdiv><div style=\"text-align: right\">SEM sacrum<\u002Fdiv><div style=\"text-align: right\">SEM L heel<\u002Fdiv><div style=\"text-align: right\">SEM R heel<\u002Fdiv><div>Leadership rounding<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"6\">\n<div style=\"display: grid; grid-template-columns: 1.9fr 1.1fr 0.8fr 1.9fr 1.1fr 0.8fr 0.8fr 0.8fr 1.6fr; gap: 16px; align-items: center; padding: 0 24px; height: 64px; border-bottom: 1px solid #EEECE6; font-size: 15px\">\n<div><button type=\"button\" sc-camel-on-click=\"{{r.open}}\" aria-label=\"Open rounding checklist for {{r.name}}\" style=\"min-height: 44px; padding: 0; background: transparent; border: none; cursor: pointer; font-size: 15px; font-weight: 600; color: #1F5FA8; text-decoration: underline; text-underline-offset: 3px; text-align: left\">{{r.name}}<\u002Fbutton><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #3F454C\">{{r.mrn}}<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px\">{{r.room}}<\u002Fdiv>\n<div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n<sc-if value=\"{{r.turnFlag}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"padding: 4px 10px; border-radius: 999px; background: #E3ECF7; color: #16467C; font-size: 13px; font-weight: 600\">Missed turn<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{r.semFlag}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"padding: 4px 10px; border-radius: 999px; background: #FBEADB; color: #8A3F08; font-size: 13px; font-weight: 600\">SEM {{r.semSites}}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"{{r.turnStyle}}\">{{r.turnText}}<\u002Fdiv>\n<div style=\"{{r.sacStyle}}\">{{r.sac}}<\u002Fdiv>\n<div style=\"{{r.lhStyle}}\">{{r.lh}}<\u002Fdiv>\n<div style=\"{{r.rhStyle}}\">{{r.rh}}<\u002Fdiv>\n<div><span style=\"{{r.roundStyle}}\">{{r.roundText}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n\n<sc-if value=\"{{empty}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding: 48px 24px; text-align: center; color: #5A6068; font-size: 15px\">No patients on this unit currently meet this trigger.<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"margin-top: auto; display: flex; justify-content: space-between; padding: 14px 24px; font-size: 13px; color: #5A6068; border-top: 1px solid #EEECE6\">\n<span>Select a patient name to complete the leadership rounding checklist. Values above threshold shown in bold.<\u002Fspan>\n<span>Sample data — fictional patients<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{modalOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(27, 30, 34, 0.5); display: flex; align-items: center; justify-content: center\">\n<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"round-title\" style=\"width: 760px; box-sizing: border-box; background: #FFFFFF; border-radius: 16px; padding: 32px 36px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.25)\">\n<div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6068\">Nursing leadership rounding · Pressure injury<\u002Fdiv>\n<h2 id=\"round-title\" style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; font-weight: 600\">{{mp.name}}<\u002Fh2>\n<div style=\"display: flex; gap: 16px; font-size: 14px; color: #3F454C\">\n<span>MRN <span style=\"font-family: 'IBM Plex Mono', monospace\">{{mp.mrn}}<\u002Fspan><\u002Fspan>\n<span>Room <span style=\"font-family: 'IBM Plex Mono', monospace\">{{mp.room}}<\u002Fspan><\u002Fspan>\n<span>{{mp.triggerText}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{closeModal}}\" aria-label=\"Close checklist\" style=\"width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; border: 1px solid #CFCCC3; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B1E22\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; border-top: 1px solid #E2E0D9\">\n<sc-for list=\"{{questions}}\" as=\"q\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 0; border-bottom: 1px solid #E2E0D9\">\n<div style=\"display: flex; gap: 14px; align-items: baseline\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: #5A6068\">{{q.num}}<\u002Fspan>\n<span style=\"font-size: 16px; line-height: 1.4\">{{q.text}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 8px; flex-shrink: 0\" role=\"group\" aria-label=\"{{q.text}}\">\n<button type=\"button\" sc-camel-on-click=\"{{q.yes}}\" aria-pressed=\"{{q.yesPressed}}\" style=\"{{q.yesStyle}}\">Yes<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{q.no}}\" aria-pressed=\"{{q.noPressed}}\" style=\"{{q.noStyle}}\">No<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<sc-if value=\"{{hasNo}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding: 12px 16px; border-radius: 10px; background: #FBEADB; color: #8A3F08; font-size: 14px; font-weight: 500\">{{noCount}} item(s) not met — address with the bedside nurse before leaving the room.<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<div style=\"font-size: 14px; color: #5A6068\">{{answeredCount}} of 4 answered{{lastRoundText}}<\u002Fdiv>\n<div style=\"display: flex; gap: 10px\">\n<button type=\"button\" sc-camel-on-click=\"{{closeModal}}\" style=\"min-height: 44px; padding: 0 20px; border-radius: 10px; border: 1px solid #CFCCC3; background: #FFFFFF; color: #1B1E22; font-size: 15px; font-weight: 600; cursor: pointer\">Cancel<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{saveRound}}\" disabled=\"{{saveDisabled}}\" style=\"{{saveStyle}}\">Save rounding<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;turnThreshold&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:4,&quot;min&quot;:1,&quot;max&quot;:8,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;h&quot;,&quot;section&quot;:&quot;Thresholds&quot;},&quot;semThreshold&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.6,&quot;min&quot;:0.3,&quot;max&quot;:1.2,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Thresholds&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1100}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { unit: 'msicu', filter: 'all', openMrn: null, draft: {}, rounds: {} };\n  }\n  renderVals() {\n    var turnT = this.props.turnThreshold != null ? this.props.turnThreshold : 4;\n    var semT = this.props.semThreshold != null ? this.props.semThreshold : 0.6;\n    function P(name, mrn, room, mins, sac, lh, rh) { return { name: name, mrn: mrn, room: room, mins: mins, sac: sac, lh: lh, rh: rh }; }\n    var unitDefs = [\n      { id: 'msicu', name: 'Medical-Surgical ICU', meta: 'Medical-Surgical ICU · 3 North · 16 beds', patients: [\n        P('Harold Jensen', '00481237', 'MS-12', 370, 0.72, 0.48, 0.51),\n        P('Maria Delgado', '00492210', 'MS-08', 125, 0.41, 0.66, 0.58),\n        P('Walter Okafor', '00477903', 'MS-02', 315, 0.55, 0.49, 0.44),\n        P('Evelyn Park', '00503318', 'MS-11', 280, 0.68, 0.71, 0.63),\n        P('Dorothy Kowalski', '00468852', 'MS-05', 90, 0.63, 0.40, 0.45),\n        P('Robert Castillo', '00488124', 'MS-14', 45, 0.38, 0.42, 0.40),\n        P('Patricia Hale', '00506690', 'MS-06', 230, 0.59, 0.55, 0.58),\n        P('George Whitfield', '00472215', 'MS-03', 140, 0.47, 0.51, 0.49),\n        P('Samuel Brooks', '00511046', 'MS-09', 425, 0.52, 0.57, 0.46)\n      ]},\n      { id: 'cticu', name: 'Cardiothoracic ICU', meta: 'Cardiothoracic ICU · 3 South · 12 beds', patients: [\n        P('Frank Moretti', '00514402', 'CT-04', 510, 0.81, 0.69, 0.74),\n        P('Angela Brewer', '00497735', 'CT-07', 265, 0.50, 0.46, 0.52),\n        P('Thomas Reyes', '00483391', 'CT-02', 180, 0.61, 0.44, 0.47),\n        P('Carol Lindqvist', '00509927', 'CT-09', 330, 0.58, 0.64, 0.66),\n        P('Kenneth Obi', '00476618', 'CT-01', 95, 0.42, 0.40, 0.43),\n        P('Ruth Sandoval', '00501184', 'CT-06', 200, 0.55, 0.52, 0.49),\n        P('Michael Tran', '00490053', 'CT-10', 250, 0.47, 0.70, 0.45)\n      ]},\n      { id: 'sdu', name: 'Stepdown Unit', meta: 'Stepdown Unit · 5 East · 28 beds', patients: [\n        P('Joan Albrecht', '00486740', '5E-21', 150, 0.45, 0.63, 0.41),\n        P('Victor Huang', '00512278', '5E-17', 60, 0.39, 0.41, 0.38),\n        P('Beverly Simmons', '00479516', '5E-24', 275, 0.52, 0.48, 0.50),\n        P('Daniel Kaminski', '00504861', '5E-19', 110, 0.44, 0.46, 0.40),\n        P('Irene Fofanah', '00493307', '5E-15', 215, 0.48, 0.44, 0.47),\n        P('Leonard Price', '00470982', '5E-22', 395, 0.66, 0.59, 0.61),\n        P('Nancy Whitaker', '00507745', '5E-26', 85, 0.41, 0.38, 0.42),\n        P('Oscar Medina', '00498830', '5E-18', 170, 0.50, 0.47, 0.45)\n      ]}\n    ];\n\n    var base = \"text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 15px;\";\n    var hi = base + ' font-weight: 600; color: #8A3F08;';\n    var lo = base + ' color: #5A6068;';\n    function flag(patients) {\n      var out = patients.map(function (p) {\n        var turnFlag = p.mins > turnT * 60;\n        var sites = [];\n        if (p.sac > semT) sites.push('sacrum');\n        if (p.lh > semT) sites.push('L heel');\n        if (p.rh > semT) sites.push('R heel');\n        var semFlag = sites.length > 0;\n        var h = Math.floor(p.mins / 60), m = p.mins % 60;\n        return {\n          name: p.name, mrn: p.mrn, room: p.room, mins: p.mins,\n          turnFlag: turnFlag, semFlag: semFlag,\n          score: (turnFlag ? 1 : 0) + (semFlag ? 1 : 0),\n          semSites: sites.join(', '),\n          turnText: h + 'h ' + (m < 10 ? '0' : '') + m + 'm',\n          turnStyle: turnFlag\n            ? \"font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: #16467C;\"\n            : \"font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #5A6068;\",\n          sac: p.sac.toFixed(2), lh: p.lh.toFixed(2), rh: p.rh.toFixed(2),\n          sacStyle: p.sac > semT ? hi : lo, lhStyle: p.lh > semT ? hi : lo, rhStyle: p.rh > semT ? hi : lo\n        };\n      }).filter(function (r) { return r.score > 0; });\n      out.sort(function (a, b) { return (b.score - a.score) || (b.mins - a.mins); });\n      return out;\n    }\n\n    var self = this;\n    var current = unitDefs[0];\n    var units = unitDefs.map(function (u) {\n      var on = self.state.unit === u.id;\n      if (on) current = u;\n      return {\n        name: u.name, flagged: flag(u.patients).length, selected: on ? 'true' : 'false',\n        pick: function () { self.setState({ unit: u.id, filter: 'all', openMrn: null, draft: {} }); },\n        style: 'min-height: 48px; padding: 0 20px; margin-bottom: -1px; background: transparent; border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; gap: 10px; ' +\n          (on ? 'font-weight: 700; color: #1B1E22; border-bottom: 3px solid #1B1E22;' : 'font-weight: 500; color: #5A6068; border-bottom: 3px solid transparent;'),\n        badgeStyle: 'min-width: 26px; padding: 2px 8px; border-radius: 999px; font-family: \\'IBM Plex Mono\\', monospace; font-size: 13px; font-weight: 600; box-sizing: border-box; text-align: center; ' +\n          (on ? 'background: #1B1E22; color: #FFFFFF;' : 'background: #E6E3DB; color: #3F454C;')\n      };\n    });\n\n    var flagged = flag(current.patients);\n    var counts = {\n      all: flagged.length,\n      turn: flagged.filter(function (r) { return r.turnFlag; }).length,\n      sem: flagged.filter(function (r) { return r.semFlag; }).length,\n      both: flagged.filter(function (r) { return r.score === 2; }).length\n    };\n    var rounds = this.state.rounds;\n    var pill = 'display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; ';\n    flagged.forEach(function (r) {\n      var rec = rounds[r.mrn];\n      r.open = function () {\n        self.setState({ openMrn: r.mrn, draft: rec ? Object.assign({}, rec.answers) : {} });\n      };\n      if (!rec) {\n        r.roundText = 'Not rounded';\n        r.roundStyle = pill + 'background: #EEECE6; color: #3F454C;';\n      } else if (rec.noCount === 0) {\n        r.roundText = rec.time + ' · 4/4 met';\n        r.roundStyle = pill + 'background: #DDEFE3; color: #1D5E38;';\n      } else {\n        r.roundText = rec.time + ' · ' + rec.noCount + ' not met';\n        r.roundStyle = pill + 'background: #FBEADB; color: #8A3F08;';\n      }\n    });\n    var roundedCount = flagged.filter(function (r) { return !!rounds[r.mrn]; }).length;\n\n    var qDefs = [\n      ['q1', 'If the patient is turned laterally, is the sacrum offloaded?'],\n      ['q2', 'Are the heels offloaded?'],\n      ['q3', 'Are all medical devices positioned away from the patient?'],\n      ['q4', \"Is the patient's skin clean and dry?\"]\n    ];\n    var draft = this.state.draft;\n    var openMrn = this.state.openMrn;\n    var mp = null;\n    flagged.forEach(function (r) { if (r.mrn === openMrn) mp = r; });\n    var btn = 'min-width: 72px; min-height: 44px; padding: 0 16px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; ';\n    function setAns(id, v) {\n      var d = Object.assign({}, self.state.draft); d[id] = v;\n      self.setState({ draft: d });\n    }\n    var questions = qDefs.map(function (q, i) {\n      var v = draft[q[0]];\n      return {\n        num: String(i + 1) + '.', text: q[1],\n        yes: function () { setAns(q[0], 'yes'); }, no: function () { setAns(q[0], 'no'); },\n        yesPressed: v === 'yes' ? 'true' : 'false', noPressed: v === 'no' ? 'true' : 'false',\n        yesStyle: btn + (v === 'yes' ? 'background: #1D5E38; color: #FFFFFF; border: 1px solid #1D5E38;' : 'background: #FFFFFF; color: #1B1E22; border: 1px solid #CFCCC3;'),\n        noStyle: btn + (v === 'no' ? 'background: #B4540C; color: #FFFFFF; border: 1px solid #B4540C;' : 'background: #FFFFFF; color: #1B1E22; border: 1px solid #CFCCC3;')\n      };\n    });\n    var answeredCount = qDefs.filter(function (q) { return !!draft[q[0]]; }).length;\n    var noCount = qDefs.filter(function (q) { return draft[q[0]] === 'no'; }).length;\n    var complete = answeredCount === qDefs.length;\n    var prev = mp ? rounds[mp.mrn] : null;\n    var saveRound = function () {\n      if (!complete || !mp) return;\n      var now = new Date();\n      var hh = now.getHours(), mm = now.getMinutes();\n      var t = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;\n      var next = Object.assign({}, self.state.rounds);\n      next[mp.mrn] = { time: t, answers: Object.assign({}, draft), noCount: noCount };\n      self.setState({ rounds: next, openMrn: null, draft: {} });\n    };\n    var modalVals = {\n      modalOpen: !!mp,\n      mp: mp ? {\n        name: mp.name, mrn: mp.mrn, room: mp.room,\n        triggerText: [mp.turnFlag ? 'Missed turn (' + mp.turnText + ')' : null, mp.semFlag ? 'SEM ' + mp.semSites : null].filter(Boolean).join(' · ')\n      } : { name: '', mrn: '', room: '', triggerText: '' },\n      questions: questions, answeredCount: answeredCount, noCount: noCount, hasNo: noCount > 0,\n      lastRoundText: prev ? ' · last saved ' + prev.time : '',\n      closeModal: function () { self.setState({ openMrn: null, draft: {} }); },\n      saveRound: saveRound, saveDisabled: !complete,\n      saveStyle: 'min-height: 44px; padding: 0 22px; border-radius: 10px; font-size: 15px; font-weight: 600; ' +\n        (complete ? 'background: #1B1E22; color: #FFFFFF; border: 1px solid #1B1E22; cursor: pointer;' : 'background: #E6E3DB; color: #6B7078; border: 1px solid #E6E3DB; cursor: not-allowed;'),\n      roundedCount: roundedCount\n    };\n\n    var f = this.state.filter;\n    var rows = flagged.filter(function (r) {\n      if (f === 'turn') return r.turnFlag;\n      if (f === 'sem') return r.semFlag;\n      if (f === 'both') return r.score === 2;\n      return true;\n    });\n    var defs = [['all', 'All high-risk'], ['turn', 'Missed turn'], ['sem', 'SEM'], ['both', 'Both']];\n    var filters = defs.map(function (d) {\n      var on = f === d[0];\n      return {\n        label: d[1], count: counts[d[0]], pressed: on ? 'true' : 'false',\n        pick: function () { self.setState({ filter: d[0] }); },\n        style: 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; ' +\n          (on ? 'background: #1B1E22; color: #FFFFFF; border: 1px solid #1B1E22;' : 'background: #FFFFFF; color: #1B1E22; border: 1px solid #CFCCC3;')\n      };\n    });\n    return Object.assign(modalVals, {\n      units: units, unitMeta: current.meta,\n      rows: rows, empty: rows.length === 0, filters: filters,\n      flaggedCount: counts.all, monitoredCount: current.patients.length,\n      turnCount: counts.turn, semCount: counts.sem, bothCount: counts.both,\n      turnThreshold: turnT, semThreshold: semT.toFixed(2).replace(/0$/, '')\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
